name: Check agency and generated site

# Optional: only run when explicitly requested and Actions budget is available.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run doctor
      - run: npm run check
      - run: npm test
      - run: npm run check:generated

# Readiness intentionally fails until the learner chooses a Worker name.
# This workflow builds and tests; it has no deployment or account credentials.
